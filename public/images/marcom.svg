    <circle cx="430" cy="98" r="23" fill="#FFFFFF" stroke="#EC3013" stroke-dasharray="3 3"/>
    <g transform="translate(417,85) scale(0.8667)"><path d="M10 3.5c2.8 0 3.8 2.8 3.8 6.3s-1 5.7-3.8 5.7-3.8-2-3.8-5.7 1-6.3 3.8-6.3z"/><path d="M7.6 18.5h4.6v2.6a2.3 2.3 0 0 1-4.6 0z"/><path d="M20 8c2.8 0 3.8 2.8 3.8 6.3s-1 5.7-3.8 5.7-3.8-2-3.8-5.7 1-6.3 3.8-6.3z"/><path d="M17.8 23h4.6v1.6a2.3 2.3 0 0 1-4.6 0z"/></g>
