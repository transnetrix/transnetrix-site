<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Archivo, Helvetica, Arial, sans-serif">
  <title>Impact traced before, during and after a programme and into its lasting footprint, around a monitoring, evaluation, accountability and learning cycle for behaviour change</title>
  <rect width="520" height="400" fill="#FFFFFF"/>
